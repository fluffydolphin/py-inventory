[project]
name = "py-inventory"
version = "0.1.0"
description = "Warehouse inventory and purchase-order API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pyjwt>=2.14.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
