# Named volume: Postgres data survives container restarts.
volumes:
  pgdata:

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:inventory@db:5432/inventory
      JWT_SECRET: dev-only-not-secret-do-not-use-in-prod
      SQL_ECHO: "0"
    depends_on:
      db:
        condition: service_healthy
